name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Tap this repository
        run: brew tap "$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE"

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app

      - name: Build and install formula
        run: brew install --build-from-source --formula "$GITHUB_REPOSITORY/ai-chat-speed-booster"

      - name: Run formula tests
        run: brew test "$GITHUB_REPOSITORY/ai-chat-speed-booster"
