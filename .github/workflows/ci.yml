name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Link checkout into Homebrew taps
        run: |
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo  "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          tap_dir="$(brew --repository)/Library/Taps/${owner}/${repo}"
          mkdir -p "$(dirname "$tap_dir")"
          rm -rf "$tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app

      - name: Build and install formula
        run: brew install --build-from-source --formula chenxiaoyu233/tap/ai-chat-speed-booster

      - name: Run formula tests
        run: brew test chenxiaoyu233/tap/ai-chat-speed-booster
